name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Accept Android SDK licenses and get SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle --no-daemon assembleDebug
        working-directory: RizeBuddy
      - run: cp app/build/outputs/apk/debug/app-debug.apk RizeBuddy.apk
        working-directory: RizeBuddy
      - uses: actions/upload-artifact@v4
        with:
          name: RizeBuddy-apk
          path: RizeBuddy/RizeBuddy.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rize Buddy (latest APK)
          files: RizeBuddy/RizeBuddy.apk
