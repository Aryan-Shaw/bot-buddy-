<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Rize Freeze</title><link rel="icon" type="image/svg+xml" href="icon-bot.svg">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;cursor:none;user-select:none}
body{display:grid;place-items:center;text-align:center;color:#fff;font:18px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 50% 35%,#3b1d4a,#0d0a1a 70%);animation:in .25s both}
@keyframes in{from{opacity:0}}
.ic{font-size:72px}h1{margin:6px 0 4px;font-size:34px;letter-spacing:-.02em}p{margin:4px 0;color:#d6c9ee;max-width:620px}
.n{font-size:120px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:18px 0 8px;color:#ffb74b}
.bar{width:360px;height:8px;border-radius:9px;background:#ffffff22;overflow:hidden;margin:0 auto}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffc24b,#f2784b);transform-origin:left}
small{display:block;margin-top:16px;color:#9d8fbd}</style></head><body>
<div><div class="ic">🛑</div><h1 id="h">Pause. Breathe.</h1><p id="p"></p><div class="n" id="n">5</div><div class="bar"><i id="b"></i></div><small>This closes by itself. Then decide: back to work?</small></div>
<script src="freeze.js"></script></body></html>
